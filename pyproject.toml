[project]
name = "r2-latency"
version = "0.1.0"
description = "R2: CP sampling latency microbenchmark (Phase 0 of the CP-joint-drafter extension)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "transformers==4.57.1",
    "accelerate",
    "typing-extensions",
    "huggingface-hub",
    "matplotlib",
    "numpy",
    "loguru",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["r2lat*"]
