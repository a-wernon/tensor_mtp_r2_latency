run_name: r2_qwen3_8b_latency

target: Qwen/Qwen3-8B
device: cuda
dtype: bfloat16
seed: 42

# Target forward-pass sweep (used as denominator).
seq_lens: [1024, 2048, 4096]

# If --skip-target is passed, we read these instead of loading the target.
# hidden_size is needed to size the shared trunks; set it to match the target.
hidden_size_override: 4096

# CP / FF sampling grid.
vocabs: [32000, 128000, 152064]   # Llama-2, Llama-3, Qwen3
block_sizes: [4, 8, 16, 32]
ranks: [4, 8, 16, 32, 64]

# Timing.
iters: 50
warmup: 10

output:
  root: runs/r2

# Decision gate: the (r, n, V, seq_len) point whose ratio is checked.
# R1 identified r=8/n=16 as the current operating point; seq_len=2048 is a
# reasonable midpoint for prefill/verification on instruction workloads.
kill_criterion:
  rank_target: 8
  block_size_target: 16
  vocab_target: 152064
  seq_len_target: 2048
  ratio_threshold: 0.3
